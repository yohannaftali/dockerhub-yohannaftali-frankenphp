name: Docker publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

env:
  IMAGE: yohannaftali/frankenphp

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - tag: latest
            php: "8.3"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: PHP_VERSION=${{ matrix.php }}
          tags: ${{ env.IMAGE }}:${{ matrix.tag }}
          push: true

  description:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: yohannaftali/frankenphp
          short-description: "FrankenPHP (PHP 8.3) with common extensions, Composer 2.2, sendmail. OS time Asia/Jakarta, PHP UTC."
          readme-filepath: ./README.md
